<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="moon" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#F0D272"/>
      <stop offset="100%" stop-color="#B8871A"/>
    </linearGradient>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#131320"/>
      <stop offset="100%" stop-color="#09090f"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>

  <!-- Subtle gold border -->
  <rect width="192" height="192" rx="44" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.25"/>

  <!-- Crescent moon: main circle minus offset cutout -->
  <circle cx="86" cy="104" r="56" fill="url(#moon)"/>
  <circle cx="111" cy="91" r="52" fill="#09090f"/>

  <!-- 5-pointed star -->
  <polygon points="138,43 141.2,52.8 151.4,52.8 143.5,58.7 146.7,68.5 138,62.6 129.3,68.5 132.5,58.7 124.6,52.8 134.8,52.8" fill="url(#moon)"/>
</svg>
